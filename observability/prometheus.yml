global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nfc-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8085']
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['grafana:3000']
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
  - job_name: 'sqlserver'
    static_configs:
      - targets: ['mssql_exporter:4000']

rule_files: []