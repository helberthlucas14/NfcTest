<mat-toolbar color="primary" class="px-4">
  <span>Notas Fiscais</span>
  <span class="flex-1"></span>
  <button mat-raised-button color="accent">Nova Nota Fiscal</button>

</mat-toolbar>

<mat-progress-bar *ngIf="isExporting" mode="indeterminate" color="accent"></mat-progress-bar>

<mat-card class="m-4">
  <table mat-table [dataSource]="notas" class="mat-elevation-z1 w-full">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef> Sel. </th>
      <td mat-cell *matCellDef="let n">
        <mat-checkbox [checked]="isSelected(n.id)" (change)="toggleRow(n.id, $event.checked)"></mat-checkbox>
      </td>
    </ng-container>
    
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> IdNota </th>
      <td mat-cell *matCellDef="let n"> {{ n.id }} </td>
    </ng-container>


    <ng-container matColumnDef="emissor">
      <th mat-header-cell *matHeaderCellDef> Emissor </th>
      <td mat-cell *matCellDef="let n"> {{ n.emissor }} </td>
    </ng-container>


    <ng-container matColumnDef="data">
      <th mat-header-cell *matHeaderCellDef> Data </th>
      <td mat-cell *matCellDef="let n"> {{ n.dataEmissao | date:'shortDate' }} </td>
    </ng-container>


    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef> Valor </th>
      <td mat-cell *matCellDef="let n"> {{ valorCalculado(n) | currency:'BRL' }} </td>
    </ng-container>


    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let n">
        <button mat-button color="primary" >[Editar]</button>
        <button mat-button color="warn" >[Excluir]</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
