<mat-toolbar color="primary" class="px-4">
  <span>Notas Fiscais</span>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" (click)="novaNota()">
    Nova Nota Fiscal
  </button>
</mat-toolbar>

<mat-card class="m-4">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 w-full">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef> Sel. </th>
      <td mat-cell *matCellDef="let n">
        <mat-checkbox [checked]="isSelected(n.id)" (change)="toggleRow(n.id, $event.checked)"></mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> IdNota </th>
      <td mat-cell *matCellDef="let n"> {{ n.id }} </td>
    </ng-container>


    <ng-container matColumnDef="emissor">
      <th mat-header-cell *matHeaderCellDef> Emissor </th>
      <td mat-cell *matCellDef="let n"> {{ n.emissor }} </td>
    </ng-container>


    <ng-container matColumnDef="data">
      <th mat-header-cell *matHeaderCellDef> Data </th>
      <td mat-cell *matCellDef="let n"> {{ n.dataEmissao | date:'shortDate' }} </td>
    </ng-container>


    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef> Valor </th>
      <td mat-cell *matCellDef="let n"> {{ valorCalculado(n) | currency:'BRL' }} </td>
    </ng-container>


    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let n">
        <button mat-button color="primary" (click)="editar(n)">[Editar]</button>
        <button mat-button color="warn" (click)="excluir(n)">[Excluir]</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
    <mat-paginator
    [length]="meta?.total || 0"
    [pageSize]="pageSize"
    [pageIndex]="(meta?.currentPage || 1) - 1"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)">
  </mat-paginator>
</mat-card>
<div class="acoes-export">
  <div class="selecoes" style="display:flex; align-items:center; gap:8px;">
    <span>Selecionados: {{ selectedIds.size }}</span>
    <button mat-stroked-button (click)="selectAllCurrentPage()">Selecionar todos</button>
    <button mat-button (click)="clearSelection()">Limpar seleção</button>
  </div>
  <div class="export-buttons" style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:8px;">
  <button mat-raised-button (click)="exportTxt()">Exportar TXT</button>
  <button mat-raised-button color="primary" (click)="exportJson()">Exportar JSON</button>
  </div>
</div>
