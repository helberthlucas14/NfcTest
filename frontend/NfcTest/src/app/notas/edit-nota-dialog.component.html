<h2 mat-dialog-title class="text-lg font-semibold">{{ data?.nota ? 'Editar Nota' : 'Nova Nota' }}</h2>
<div mat-dialog-content [formGroup]="form" class="min-w-[320px] space-y-4">
  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Emissor</mat-label>
    <input matInput formControlName="emissor" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Data de Emissão</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="data" />
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <div formArrayName="items" class="space-y-2">
    <div *ngFor="let item of itemsControls(); let i = index" [formGroup]="item" class="flex flex-col sm:flex-row gap-2 sm:items-center">
      <mat-form-field appearance="outline" class="w-full sm:flex-1">
        <mat-label>Descrição</mat-label>
        <input matInput formControlName="descricao" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full sm:w-56">
        <mat-label>Valor</mat-label>
        <input matInput type="number" step="0.01" formControlName="valor" />
      </mat-form-field>
      <button mat-button color="warn" type="button" (click)="removeItem(i)">Remover</button>
    </div>
    <div class="mt-2">
      <button mat-stroked-button color="primary" type="button" (click)="addItem()">Adicionar Item</button>
    </div>
  </div>
</div>
<div mat-dialog-actions align="end" class="mt-4 gap-2">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="salvar()" [disabled]="form.invalid">Salvar</button>
  
</div>
